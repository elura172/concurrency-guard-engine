[project]
name = "concurrency-guard-engine"
version = "0.1.0"
description = "Transactional wallet ledger with SQLite and PostgreSQL concurrency control plus a static code sentinel"
authors = [{ name = "elura172", email = "228485553+elura172@users.noreply.github.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
