[project]
name = "concurrency-guard-engine"
version = "0.1.0"
description = "High-concurrency financial ledger, race condition elimination & AI-augmented CI/CD sentinel"
authors = [{ name = "Paul Trafford", email = "paul.trafford@protonmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
